DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지뢰찾기 (Minesweeper Classic & Neo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-board: #c0c0c0;
      --border-light: #ffffff;
      --border-dark: #7b7b7b;
      --border-darkest: #404040;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-digital {
      font-family: 'Press Start 2P', monospace, sans-serif;
    }

    .font-chakra {
      font-family: 'Chakra Petch', sans-serif;
    }

    /* 클래식 입체 베젤 효과 (Windows 95/98 스타일) */
    .bevel-outset {
      border: 3px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
    }

    .bevel-inset {
      border: 3px solid;
      border-color: #808080 #ffffff #ffffff #808080;
    }

    .cell-unrevealed {
      border: 2.5px solid;
      border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
      background-color: #c0c0c0;
    }

    .cell-unrevealed:active {
      border: 1.5px solid #7b7b7b;
      background-color: #bdbdbd;
    }

    .cell-revealed {
      border: 1px solid #7b7b7b;
      background-color: #d1d5db;
    }

    /* 숫자별 고전 색상 매핑 */
    .num-1 { color: #0000ff; }
    .num-2 { color: #007b00; }
    .num-3 { color: #ff0000; }
    .num-4 { color: #00007b; }
    .num-5 { color: #7b0000; }
    .num-6 { color: #007b7b; }
    .num-7 { color: #000000; }
    .num-8 { color: #7b7b7b; }

    /* 부드러운 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #9ca3af;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center justify-between p-2 sm:p-4 select-none">

  <header class="w-full max-w-2xl flex flex-col items-center mb-2 sm:mb-4">
    <div class="flex items-center justify-between w-full px-2 py-2">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">💣</span>
        <h1 class="text-xl sm:text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-amber-300 to-yellow-400">
          MINESWEEPER
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <button id="soundToggleBtn" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold transition flex items-center space-x-1" title="사운드 켜기/끄기">
          <span id="soundIcon">🔊</span>
          <span class="hidden sm:inline" id="soundLabel">소리 ON</span>
        </button>
        <button id="helpBtn" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold transition" title="규칙 및 팁">
          ❓ 도움말
        </button>
      </div>
    </div>

    <!-- 난이도 선택 버튼 탭 -->
    <div class="flex bg-slate-800/90 p-1 rounded-xl border border-slate-700 text-xs sm:text-sm font-semibold mt-1 shadow-lg">
      <button class="diff-btn px-3 sm:px-4 py-1.5 rounded-lg transition bg-amber-500 text-slate-950 font-bold" data-diff="beginner">
        초급 (9x9)
      </button>
      <button class="diff-btn px-3 sm:px-4 py-1.5 rounded-lg transition text-slate-300 hover:text-white" data-diff="intermediate">
        중급 (16x16)
      </button>
      <button class="diff-btn px-3 sm:px-4 py-1.5 rounded-lg transition text-slate-300 hover:text-white" data-diff="expert">
        고급 (16x30)
      </button>
    </div>
  </header>

  <main class="w-full flex-1 flex flex-col items-center justify-center max-w-full overflow-hidden">
    <div class="inline-block bg-[#c0c0c0] text-black p-3 sm:p-4 rounded-xl shadow-2xl bevel-outset max-w-full">
      
      <!-- 상단 클래식 상태 패널 (지뢰 카운터, 이모지 스마일 버튼, 타이머) -->
      <div class="bg-[#c0c0c0] bevel-inset p-2 mb-3 flex items-center justify-between gap-4">
        <!-- 지뢰 남은 개수 LED -->
        <div class="bg-black px-2 py-1 rounded bevel-inset flex items-center">
          <span id="mineCounter" class="font-digital text-red-600 text-lg sm:text-2xl tracking-widest">
            010
          </span>
        </div>

        <!-- 리셋 스마일 버튼 -->
        <button id="resetBtn" class="w-10 h-10 sm:w-12 sm:h-12 bg-[#c0c0c0] bevel-outset active:border active:border-gray-600 flex items-center justify-center text-xl sm:text-2xl rounded hover:brightness-105 active:brightness-95 transition" aria-label="새 게임 시작">
          <span id="faceIcon">🙂</span>
        </button>

        <!-- 타이머 LED -->
        <div class="bg-black px-2 py-1 rounded bevel-inset flex items-center">
          <span id="timerDisplay" class="font-digital text-red-600 text-lg sm:text-2xl tracking-widest">
            000
          </span>
        </div>
      </div>

      <!-- 게임 보드 격자 영역 -->
      <div class="overflow-auto max-h-[62vh] max-w-[92vw] bevel-inset p-1 bg-[#808080] flex justify-center items-start rounded">
        <div id="board" class="grid select-none touch-none inline-grid bg-[#808080]">
          <!-- 자바스크립트로 셀 생성 -->
        </div>
      </div>

      <!-- 모바일 편의 조작바 (깃발 모드 토글) -->
      <div class="mt-3 flex items-center justify-between text-xs font-bold text-slate-800 border-t border-gray-400 pt-2">
        <div class="flex items-center space-x-2">
          <button id="flagModeToggle" class="px-3 py-1.5 rounded-lg border-2 border-slate-700 bg-white shadow flex items-center space-x-1.5 transition active:scale-95">
            <span id="flagModeIndicator" class="w-3 h-3 rounded-full bg-slate-400 inline-block"></span>
            <span>🚩 깃발 모드: <span id="flagModeStatus" class="text-slate-600">OFF</span></span>
          </button>
        </div>
        <div class="text-[11px] text-slate-700 hidden sm:block">
          우클릭: 깃발 | 양클릭/더블클릭: 주변 열기
        </div>
        <div class="text-[11px] text-slate-700 sm:hidden">
          길게 누르기: 깃발
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-xl text-center py-2 text-xs text-slate-400">
    <div class="flex justify-center items-center gap-4 text-[11px] mb-1">
      <span>최단 기록:</span>
      <span>초급 <b id="bestBeginner" class="text-amber-400">-</b></span>
      <span>중급 <b id="bestIntermediate" class="text-amber-400">-</b></span>
      <span>고급 <b id="bestExpert" class="text-amber-400">-</b></span>
    </div>
    <p class="text-[10px] text-slate-500">© 2026 Classic Minesweeper Engine • First Click Guaranteed Safe</p>
  </footer>

  <!-- 안내 및 게임오버/승리 모달 -->
  <div id="gameModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-600 text-white rounded-2xl max-w-sm w-full p-5 shadow-2xl transform transition-all text-center">
      <div id="modalIcon" class="text-4xl mb-2">🎉</div>
      <h3 id="modalTitle" class="text-lg font-black mb-2 text-yellow-400">축하합니다! 승리하셨습니다!</h3>
      <div id="modalBody" class="text-sm text-slate-300 mb-5 leading-relaxed">
        모든 지뢰를 찾아내고 안전하게 승리했습니다.
      </div>
      <button id="modalCloseBtn" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:brightness-110 active:scale-95 text-slate-950 font-black rounded-xl transition shadow-lg">
        확인
      </button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const sound = {
      click() {
        if (!isSoundOn || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      },
      flag() {
        if (!isSoundOn || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      },
      unflag() {
        if (!isSoundOn || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      },
      explode() {
        if (!isSoundOn || !audioCtx) return;
        const now = audioCtx.currentTime;
        // 화이트 노이즈 버퍼를 통한 실감나는 폭발음 합성
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(50, now + 0.5);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        whiteNoise.start(now);
      },
      win() {
        if (!isSoundOn || !audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.1);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.1);
          osc.stop(audioCtx.currentTime + i * 0.1 + 0.18);
        });
      }
    };

    const DIFFICULTIES = {
      beginner: { rows: 9, cols: 9, mines: 10, name: '초급' },
      intermediate: { rows: 16, cols: 16, mines: 40, name: '중급' },
      expert: { rows: 16, cols: 30, mines: 99, name: '고급' }
    };

    let currentDiffKey = 'beginner';
    let currentConfig = DIFFICULTIES.beginner;

    let board = [];
    let isFirstClick = true;
    let isGameOver = false;
    let isVictory = false;
    let flagsPlaced = 0;
    let timer = 0;
    let timerInterval = null;
    let flagMode = false; // 모바일 터치용 깃발 모드 토글
    let revealedSafeCount = 0;

    // DOM 참조
    const boardEl = document.getElementById('board');
    const mineCounterEl = document.getElementById('mineCounter');
    const timerDisplayEl = document.getElementById('timerDisplay');
    const faceIconEl = document.getElementById('faceIcon');
    const resetBtn = document.getElementById('resetBtn');
    const flagModeToggle = document.getElementById('flagModeToggle');
    const flagModeStatus = document.getElementById('flagModeStatus');
    const flagModeIndicator = document.getElementById('flagModeIndicator');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');
    const helpBtn = document.getElementById('helpBtn');
    const gameModal = document.getElementById('gameModal');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const diffButtons = document.querySelectorAll('.diff-btn');

    function loadBestTimes() {
      ['beginner', 'intermediate', 'expert'].forEach(key => {
        const val = localStorage.getItem(`minesweeper_best_${key}`);
        const el = document.getElementById(`best${key.charAt(0).toUpperCase() + key.slice(1)}`);
        if (el) {
          el.textContent = val ? `${val}초` : '-';
        }
      });
    }

    function checkAndSaveBestTime(time) {
      const key = `minesweeper_best_${currentDiffKey}`;
      const prev = localStorage.getItem(key);
      if (!prev || time < parseInt(prev, 10)) {
        localStorage.setItem(key, time);
        loadBestTimes();
        return true;
      }
      return false;
    }

    function format3Digits(num) {
      if (num < 0) {
        return '-' + Math.min(Math.abs(num), 99).toString().padStart(2, '0');
      }
      return Math.min(num, 999).toString().padStart(3, '0');
    }

    function updateMineCounterDisplay() {
      const remaining = currentConfig.mines - flagsPlaced;
      mineCounterEl.textContent = format3Digits(remaining);
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timer = 0;
      timerDisplayEl.textContent = '000';
      timerInterval = setInterval(() => {
        if (!isGameOver && !isVictory) {
          timer++;
          timerDisplayEl.textContent = format3Digits(timer);
          if (timer >= 999) {
            clearInterval(timerInterval);
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function initGame() {
      stopTimer();
      isFirstClick = true;
      isGameOver = false;
      isVictory = false;
      flagsPlaced = 0;
      revealedSafeCount = 0;
      timer = 0;
      timerDisplayEl.textContent = '000';
      faceIconEl.textContent = '🙂';
      updateMineCounterDisplay();

      // 보드 배열 초기화
      board = [];
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, minmax(0, 1fr))`;

      // 반응형 크기 계산 (고급의 경우 셀을 살짝 콤팩트하게)
      let cellSize = 'w-7 h-7 sm:w-8 sm:h-8 text-xs sm:text-sm';
      if (currentConfig.cols > 20) {
        cellSize = 'w-6 h-6 sm:w-7 sm:h-7 text-[10px] sm:text-xs';
      }

      for (let r = 0; r < currentConfig.rows; r++) {
        const row = [];
        for (let c = 0; c < currentConfig.cols; c++) {
          const cellObj = {
            r,
            c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            adjacentMines: 0,
            element: null
          };

          const cellEl = document.createElement('div');
          cellEl.className = `${cellSize} cell-unrevealed flex items-center justify-center font-bold cursor-pointer transition select-none`;
          cellEl.dataset.row = r;
          cellEl.dataset.col = c;

          // 터치 및 마우스 이벤트 바인딩
          attachCellEvents(cellEl, cellObj);

          cellObj.element = cellEl;
          row.push(cellObj);
          boardEl.appendChild(cellEl);
        }
        board.push(row);
      }
    }

    function placeMines(firstRow, firstCol) {
      const totalCells = currentConfig.rows * currentConfig.cols;
      let minesToPlace = currentConfig.mines;

      // 첫 클릭 위치 및 주변 8방향 좌표 보호 (초보자 편의를 위해 첫 클릭을 항상 빈칸(0)으로 유도)
      const protectedCoords = new Set();
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = firstRow + dr;
          const nc = firstCol + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            protectedCoords.add(`${nr},${nc}`);
          }
        }
      }

      // 보호 영역을 제외하고 남은 빈칸이 부족할 경우 첫 위치만 보호
      if (totalCells - protectedCoords.size < minesToPlace) {
        protectedCoords.clear();
        protectedCoords.add(`${firstRow},${firstCol}`);
      }

      while (minesToPlace > 0) {
        const r = Math.floor(Math.random() * currentConfig.rows);
        const c = Math.floor(Math.random() * currentConfig.cols);
        const key = `${r},${c}`;

        if (!board[r][c].isMine && !protectedCoords.has(key)) {
          board[r][c].isMine = true;
          minesToPlace--;
        }
      }

      // 각 셀별 인접 지뢰 개수 계산
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          if (!board[r][c].isMine) {
            board[r][c].adjacentMines = countAdjacentMines(r, c);
          }
        }
      }
    }

    function countAdjacentMines(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            if (board[nr][nc].isMine) count++;
          }
        }
      }
      return count;
    }

    function attachCellEvents(el, cell) {
      let touchTimer = null;
      let isLongTouch = false;

      // 마우스 우클릭 (깃발 토글)
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        initAudio();
        toggleFlag(cell);
      });

      // 마우스 좌클릭
      el.addEventListener('click', (e) => {
        if (isLongTouch) {
          isLongTouch = false;
          return;
        }
        initAudio();

        if (flagMode) {
          toggleFlag(cell);
        } else {
          handleCellClick(cell);
        }
      });

      // 마우스 휠 클릭 / 더블클릭 (코드 열기 - Chording)
      el.addEventListener('dblclick', (e) => {
        e.preventDefault();
        chordCell(cell);
      });

      el.addEventListener('mousedown', (e) => {
        if (e.button === 1) { // 휠클릭
          e.preventDefault();
          chordCell(cell);
        } else if (!isGameOver && !isVictory && !cell.isRevealed) {
          faceIconEl.textContent = '😮';
        }
      });

      window.addEventListener('mouseup', () => {
        if (!isGameOver && !isVictory) {
          faceIconEl.textContent = '🙂';
        }
      });

      // 모바일 롱프레스 (길게 눌러 깃발)
      el.addEventListener('touchstart', (e) => {
        isLongTouch = false;
        touchTimer = setTimeout(() => {
          isLongTouch = true;
          if (navigator.vibrate) navigator.vibrate(40);
          toggleFlag(cell);
        }, 360);
      }, { passive: true });

      el.addEventListener('touchend', () => {
        if (touchTimer) clearTimeout(touchTimer);
      });

      el.addEventListener('touchmove', () => {
        if (touchTimer) clearTimeout(touchTimer);
      });
    }

    function toggleFlag(cell) {
      if (isGameOver || isVictory || cell.isRevealed) return;

      if (cell.isFlagged) {
        cell.isFlagged = false;
        cell.element.textContent = '';
        flagsPlaced--;
        sound.unflag();
      } else {
        // 남은 지뢰수와 무관하게 깃발 설치 허용 (클래식 룰)
        cell.isFlagged = true;
        cell.element.textContent = '🚩';
        flagsPlaced++;
        sound.flag();
      }
      updateMineCounterDisplay();
    }

    function handleCellClick(cell) {
      if (isGameOver || isVictory || cell.isFlagged || cell.isRevealed) return;

      // 첫 클릭 시 지뢰 배치 및 타이머 가동
      if (isFirstClick) {
        isFirstClick = false;
        placeMines(cell.r, cell.c);
        startTimer();
      }

      if (cell.isMine) {
        gameOver(cell);
        return;
      }

      revealCell(cell);
      sound.click();

      // 승리 조건 검사
      checkVictory();
    }

    function revealCell(cell) {
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      revealedSafeCount++;
      cell.element.classList.remove('cell-unrevealed');
      cell.element.classList.add('cell-revealed');

      if (cell.adjacentMines > 0) {
        cell.element.textContent = cell.adjacentMines;
        cell.element.classList.add(`num-${cell.adjacentMines}`);
      } else {
        // 빈칸(0)인 경우 인접 8개 영역 자동 확장 (BFS Flood Fill)
        cell.element.textContent = '';
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = cell.r + dr;
            const nc = cell.c + dc;
            if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
              const neighbor = board[nr][nc];
              if (!neighbor.isRevealed && !neighbor.isMine) {
                revealCell(neighbor);
              }
            }
          }
        }
      }
    }

    function chordCell(cell) {
      if (!cell.isRevealed || cell.adjacentMines === 0 || isGameOver || isVictory) return;

      // 인접 깃발 개수 확인
      let flagCount = 0;
      const neighbors = [];

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = cell.r + dr;
          const nc = cell.c + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            const nb = board[nr][nc];
            neighbors.push(nb);
            if (nb.isFlagged) flagCount++;
          }
        }
      }

      // 깃발 개수가 적힌 숫자와 정확히 일치할 때만 열기
      if (flagCount === cell.adjacentMines) {
        let hitMine = null;
        neighbors.forEach(nb => {
          if (!nb.isRevealed && !nb.isFlagged) {
            if (nb.isMine) {
              hitMine = nb;
            } else {
              revealCell(nb);
            }
          }
        });

        if (hitMine) {
          gameOver(hitMine);
        } else {
          sound.click();
          checkVictory();
        }
      }
    }

    function gameOver(explodedCell) {
      isGameOver = true;
      stopTimer();
      faceIconEl.textContent = '😵';
      sound.explode();

      // 전체 지뢰 노출 및 오답 깃발 표시
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const item = board[r][c];
          if (item.isMine) {
            if (!item.isFlagged) {
              item.element.classList.remove('cell-unrevealed');
              item.element.classList.add('cell-revealed');
              item.element.textContent = '💣';
              if (item === explodedCell) {
                item.element.classList.add('bg-red-500');
              }
            }
          } else if (item.isFlagged) {
            // 잘못 꽂은 깃발 표시 (❌)
            item.element.textContent = '❌';
            item.element.classList.add('bg-orange-200');
          }
        }
      }

      showModal('💥 게임 오버', '지뢰를 밟았습니다! 다시 도전해보세요.', '💣');
    }

    function checkVictory() {
      const totalSafeCells = (currentConfig.rows * currentConfig.cols) - currentConfig.mines;
      if (revealedSafeCount === totalSafeCells && !isGameOver) {
        isVictory = true;
        stopTimer();
        faceIconEl.textContent = '😎';
        sound.win();

        // 남은 모든 지뢰 위치에 깃발 자동 배치
        for (let r = 0; r < currentConfig.rows; r++) {
          for (let c = 0; c < currentConfig.cols; c++) {
            const item = board[r][c];
            if (item.isMine && !item.isFlagged) {
              item.isFlagged = true;
              item.element.textContent = '🚩';
            }
          }
        }
        flagsPlaced = currentConfig.mines;
        updateMineCounterDisplay();

        const isNewRecord = checkAndSaveBestTime(timer);
        let msg = `클리어 시간: ${timer}초!`;
        if (isNewRecord) {
          msg += ' 🏆 신기록을 달성했습니다!';
        }

        showModal('🎉 승리 완료!', msg, '🏆');
      }
    }

    function showModal(title, message, icon = 'ℹ️') {
      modalIcon.textContent = icon;
      modalTitle.textContent = title;
      modalBody.textContent = message;
      gameModal.classList.remove('hidden');
    }

    function hideModal() {
      gameModal.classList.add('hidden');
    }

    resetBtn.addEventListener('click', () => {
      initAudio();
      initGame();
    });

    modalCloseBtn.addEventListener('click', hideModal);
    gameModal.addEventListener('click', (e) => {
      if (e.target === gameModal) hideModal();
    });

    // 난이도 변경 버튼
    diffButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        initAudio();
        const diffKey = e.currentTarget.dataset.diff;
        if (diffKey && DIFFICULTIES[diffKey]) {
          currentDiffKey = diffKey;
          currentConfig = DIFFICULTIES[diffKey];

          diffButtons.forEach(b => {
            b.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
            b.classList.add('text-slate-300');
          });
          e.currentTarget.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
          e.currentTarget.classList.remove('text-slate-300');

          initGame();
        }
      });
    });

    // 모바일 깃발 모드 토글 버튼
    flagModeToggle.addEventListener('click', () => {
      initAudio();
      flagMode = !flagMode;
      if (flagMode) {
        flagModeStatus.textContent = 'ON';
        flagModeStatus.classList.remove('text-slate-600');
        flagModeStatus.classList.add('text-red-600');
        flagModeIndicator.classList.remove('bg-slate-400');
        flagModeIndicator.classList.add('bg-red-500', 'animate-pulse');
        flagModeToggle.classList.add('bg-amber-100', 'border-red-500');
      } else {
        flagModeStatus.textContent = 'OFF';
        flagModeStatus.classList.remove('text-red-600');
        flagModeStatus.classList.add('text-slate-600');
        flagModeIndicator.classList.remove('bg-red-500', 'animate-pulse');
        flagModeIndicator.classList.add('bg-slate-400');
        flagModeToggle.classList.remove('bg-amber-100', 'border-red-500');
      }
    });

    // 사운드 On/Off 토글
    soundToggleBtn.addEventListener('click', () => {
      initAudio();
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        soundIcon.textContent = '🔊';
        soundLabel.textContent = '소리 ON';
      } else {
        soundIcon.textContent = '🔇';
        soundLabel.textContent = '소리 OFF';
      }
    });

    // 규칙 안내 모달
    helpBtn.addEventListener('click', () => {
      initAudio();
      showModal(
        '지뢰찾기 조작 & 팁',
        '• 첫 번째 클릭은 언제나 지뢰가 나오지 않습니다.\n' +
        '• 좌클릭: 칸 열기\n' +
        '• 우클릭 / 롱터치: 깃발(🚩) 꽂기/해제\n' +
        '• 더블클릭 / 휠클릭: 이미 열린 숫자의 주변 깃발 수가 맞으면 남은 주변 칸을 한번에 엽니다 (Chording).\n' +
        '• 모바일에서는 하단의 [🚩 깃발 모드] 토글을 켜면 터치만으로 깃발을 꽂을 수 있습니다.',
        '🎮'
      );
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadBestTimes();
      initGame();
    });
  </script>
</body>
